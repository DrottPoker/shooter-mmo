name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      SHOOTER_MMO_TEST_POSTGRES: Host=localhost;Port=5432;Database=shooter_mmo_tests;Username=shooter_mmo_tests;Password=shooter_mmo_tests_password

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shooter_mmo_tests
          POSTGRES_USER: shooter_mmo_tests
          POSTGRES_PASSWORD: shooter_mmo_tests_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shooter_mmo_tests -d shooter_mmo_tests"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify dependency policy
        shell: pwsh
        run: ./Tools/Verify-DependencyPolicy.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore ShooterMmo.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format ShooterMmo.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ShooterMmo.slnx --configuration Release --no-restore

      - name: Verify item catalog
        run: >-
          dotnet run --project Tools/ItemCatalogCompiler
          --configuration Release
          --no-build
          --
          WorldData/Authoring/Items/core.item-catalog.json
          WorldData/Runtime/Items/core.item-catalog.json
          --verify

      - name: Verify World collision data
        run: >-
          dotnet run --project Tools/WorldCollisionCompiler
          --configuration Release
          --no-build
          --
          WorldData/Authoring/development-world-1.collision-authoring.json
          WorldData/Runtime/Resources/ShooterMmo/WorldCollision/development-world-1
          --verify

      - name: Verify Development World 2 collision data
        run: >-
          dotnet run --project Tools/WorldCollisionCompiler
          --configuration Release
          --no-build
          --
          WorldData/Authoring/development-world-2.collision-authoring.json
          WorldData/Runtime/Resources/ShooterMmo/WorldCollision/development-world-2
          --verify

      - name: Verify Development World 1 actors
        run: >-
          dotnet run --project Tools/WorldActorCompiler
          --configuration Release
          --no-build
          --
          --verify

      - name: Verify Development World 2 actors
        run: >-
          dotnet run --project Tools/WorldActorCompiler
          --configuration Release
          --no-build
          --
          WorldData/Authoring/Actors/core.world-actors.json
          WorldData/Authoring/ActorSpawns/development-world-2.actor-spawns.json
          WorldData/Runtime/Actors/development-world-2.world-actors.json
          --verify

      - name: Test
        run: >-
          dotnet test ShooterMmo.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  unity:
    name: Unity quality gate
    if: vars.UNITY_CI_ENABLED == 'true'
    runs-on: [self-hosted, Windows, X64, unity-6000.5.2f1]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify dependency policy
        shell: pwsh
        run: ./Tools/Verify-DependencyPolicy.ps1

      - name: Run Unity EditMode and PlayMode tests
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH }}
        run: ./Tools/Run-UnityTests.ps1

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: TestResults/Unity
          if-no-files-found: warn
          retention-days: 14
