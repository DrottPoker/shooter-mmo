name: CI

# Task branches are checked through their pull request, so a push to them does not start a
# second run of the same commit. The long-lived branches are checked on every push.
on:
  push:
    branches:
      - development
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

# The backend gate runs as parallel jobs that together cover the README quality checks:
# one job verifies, builds, and runs every test outside Category=Integration, and the
# integration matrix runs the PostgreSQL and Redis tests, with the Items tests on their
# own runner. Each job fails when any of its tests did not run or pass. A separate job
# validates the monitoring stack in observability/ with its pinned images.
jobs:
  backend:
    name: Backend checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify dependency policy
        shell: pwsh
        run: ./tools/Verify-DependencyPolicy.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore Mmorpg.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format Mmorpg.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Mmorpg.slnx --configuration Release --no-restore

      - name: Verify item catalog
        run: >-
          dotnet run --project tools/ItemCatalogCompiler
          --configuration Release
          --no-build
          --
          --verify

      - name: Verify world collision data
        run: >-
          dotnet run --project tools/WorldCollisionCompiler
          --configuration Release
          --no-build
          --
          --verify

      - name: Verify world actors
        run: >-
          dotnet run --project tools/WorldActorCompiler
          --configuration Release
          --no-build
          --
          --verify

      - name: Verify generated realtime protocol
        run: >-
          dotnet run --project tools/ProtocolGenerator
          --configuration Release
          --no-build
          --
          --verify

      # Every test project writes TestResults/<Project>/test-results.trx and its own
      # coverage folder, set by tests/Directory.Build.props.
      - name: Test
        run: >-
          dotnet test Mmorpg.slnx
          --configuration Release
          --no-build
          --filter "Category!=Integration"
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"

      - name: Verify every test ran
        shell: pwsh
        run: ./tools/Verify-TestResults.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: Integration tests (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: items
            project: tests/Server/Mmorpg.GameService.Items.Tests
            filter: Category=Integration
          - name: other
            project: Mmorpg.slnx
            filter: Category=Integration&FullyQualifiedName!~Mmorpg.GameService.Items.Tests.
    env:
      MMORPG_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=shooter_mmo_tests;Username=shooter_mmo_tests;Password=shooter_mmo_tests_password
      MMORPG_TEST_REDIS: 127.0.0.1:6379

    # PostgreSQL keeps its data in memory, as in docker-compose.test.yml, because the
    # tests create a database per test.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shooter_mmo_tests
          POSTGRES_USER: shooter_mmo_tests
          POSTGRES_PASSWORD: shooter_mmo_tests_password
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U shooter_mmo_tests -d shooter_mmo_tests"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore Mmorpg.slnx --locked-mode

      - name: Build
        run: dotnet build ${{ matrix.suite.project }} --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test ${{ matrix.suite.project }}
          --configuration Release
          --no-build
          --filter "${{ matrix.suite.filter }}"
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"

      - name: Verify every test ran
        shell: pwsh
        run: ./tools/Verify-TestResults.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-${{ matrix.suite.name }}-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  observability:
    name: Observability configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Validates the collector and Prometheus configuration, runs the promtool alert
      # rule tests, and parses the Grafana dashboards with the images pinned in
      # docker-compose.observability.yml.
      - name: Verify the monitoring stack configuration
        shell: pwsh
        run: ./tools/Verify-Observability.ps1

  # Unity needs an installed and licensed Editor, so this job runs on the self-hosted runner
  # described in docs/LOCAL_DEVELOPMENT.md. Pull requests from forks are skipped. The runner's
  # job-started hook, tools/Assert-TrustedRunnerJob.ps1, refuses them as well, because a
  # fork pull request runs its own copy of this file. Windows PowerShell keeps PowerShell 7
  # off the runner requirements; the backend job already verifies the dependency policy.
  unity:
    name: Unity quality gate
    if: >-
      vars.UNITY_CI_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64, unity-6000.5.4f1]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Unity EditMode and PlayMode tests
        shell: powershell
        env:
          UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH }}
        run: ./tools/Run-UnityTests.ps1

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-test-results
          path: TestResults/Unity
          if-no-files-found: warn
          retention-days: 14
