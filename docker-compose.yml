services:
  postgres:
    image: postgres:16-alpine
    container_name: shooter_mmo_postgres
    environment:
      POSTGRES_DB: shooter_mmo
      POSTGRES_USER: shooter_mmo
      POSTGRES_PASSWORD: shooter_mmo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - shooter_mmo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shooter_mmo -d shooter_mmo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shooter_mmo_redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  shooter_mmo_postgres_data:

