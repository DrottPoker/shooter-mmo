name: shooter-mmo-stack-stress

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shooter_mmo_stack_stress_test
      POSTGRES_USER: shooter_mmo_stack_stress
      POSTGRES_PASSWORD: stack_stress_local_only
    ports:
      - "127.0.0.1:56432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U shooter_mmo_stack_stress -d shooter_mmo_stack_stress_test
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 2s
      timeout: 3s
      retries: 20
