# promtool unit tests for the playtest alerts. Run them with
# tools/Verify-Observability.ps1, which uses the pinned Prometheus image.
rule_files:
  - ../rules/playtest.rules.yml

evaluation_interval: 15s

tests:
  - name: A worker that stops reporting and its offline shard alert, GameService stays quiet
    interval: 15s
    input_series:
      - series: 'target_info{job="mmorpg/game-service", instance="g1"}'
        values: '1x40'
      - series: 'target_info{job="mmorpg/simulation-worker", instance="local-simulation-worker-1"}'
        values: '1x8 _x32'
      - series: 'game_service_placement_shard_online{job="mmorpg/game-service", instance="g1", shard_id="local-shard-1"}'
        values: '1x8 0x32'
    alert_rule_test:
      - eval_time: 2m
        alertname: SimulationWorkerDown
        exp_alerts: []
      - eval_time: 5m
        alertname: SimulationWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: mmorpg/simulation-worker
            exp_annotations:
              summary: No SimulationWorker has reported telemetry for two minutes.
      - eval_time: 5m
        alertname: GameServiceDown
        exp_alerts: []
      - eval_time: 2m
        alertname: ShardOffline
        exp_alerts: []
      - eval_time: 5m
        alertname: ShardOffline
        exp_alerts:
          - exp_labels:
              severity: critical
              shard_id: local-shard-1
            exp_annotations:
              summary: Shard local-shard-1 is offline in the shard list, so players cannot join it.

  - name: Tick overruns alert above one percent of ticks only
    interval: 15s
    input_series:
      # 30 ticks per second, so 450 ticks per sample.
      - series: 'simulation_worker_simulation_tick_duration_milliseconds_count{instance="w1"}'
        values: '0+450x40'
      - series: 'simulation_worker_simulation_tick_overruns_total{instance="w1"}'
        values: '0+9x40'
      - series: 'simulation_worker_simulation_tick_duration_milliseconds_count{instance="w2"}'
        values: '0+450x40'
      - series: 'simulation_worker_simulation_tick_overruns_total{instance="w2"}'
        values: '0+2x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: SimulationTickOverruns
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: w1
            exp_annotations:
              summary: More than 1 percent of the fixed ticks on w1 take longer than the tick interval.

  - name: A worker that used more than half of its entity ids warns, one that did not stays quiet
    interval: 15s
    input_series:
      # Half of 4,294,967,295 rounded down is 2,147,483,647: the third sample is the first above it.
      - series: 'simulation_worker_realtime_entity_ids_used{job="mmorpg/simulation-worker", instance="w1"}'
        values: '1000 2147483647 2147483648 2147483649'
      - series: 'simulation_worker_realtime_entity_ids_used{job="mmorpg/simulation-worker", instance="w2"}'
        values: '1000 1001 1002 1003'
    alert_rule_test:
      - eval_time: 15s
        alertname: SimulationEntityIdsHalfUsed
        exp_alerts: []
      - eval_time: 30s
        alertname: SimulationEntityIdsHalfUsed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: w1
            exp_annotations:
              summary: The worker on w1 used more than half of its entity ids; restart it at a quiet hour, as docs/MONITORING.md describes under Entity Ids.

  - name: GameService 5xx responses above one percent
    interval: 15s
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="mmorpg/game-service", http_route="/api/shards", http_response_status_code="200"}'
        values: '0+100x40'
      - series: 'http_server_request_duration_seconds_count{job="mmorpg/game-service", http_route="/api/shards", http_response_status_code="500"}'
        values: '0+5x40'
    alert_rule_test:
      - eval_time: 2m
        alertname: GameServiceErrorRate
        exp_alerts: []
      - eval_time: 8m
        alertname: GameServiceErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: More than 1 percent of the GameService requests fail with a 5xx status.

  - name: Database pool saturation
    interval: 15s
    input_series:
      - series: 'db_client_connection_count{job="mmorpg/game-service", instance="g1", db_client_connection_state="used"}'
        values: '60x20'
      - series: 'db_client_connection_count{job="mmorpg/game-service", instance="g1", db_client_connection_state="idle"}'
        values: '4x20'
      - series: 'db_client_connection_max{job="mmorpg/game-service", instance="g1"}'
        values: '64x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: DatabasePoolSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: g1
            exp_annotations:
              summary: GameService g1 uses more than 90 percent of its PostgreSQL connection pool.

  - name: An economy audit violation alerts by check, and a failed run warns
    interval: 15m
    input_series:
      - series: 'game_service_audit_violations{job="mmorpg/game-service", instance="g1", check="item_custody_missing"}'
        values: '0 0 2 2'
      - series: 'game_service_audit_violations{job="mmorpg/game-service", instance="g1", check="currency_balance_matches_ledger"}'
        values: '0 0 0 0'
      - series: 'game_service_audit_runs_total{job="mmorpg/game-service", instance="g1", outcome="failed"}'
        values: '0 0 0 1'
    alert_rule_test:
      - eval_time: 15m
        alertname: EconomyAuditViolations
        exp_alerts: []
      - eval_time: 30m
        alertname: EconomyAuditViolations
        exp_alerts:
          - exp_labels:
              severity: critical
              check: item_custody_missing
            exp_annotations:
              summary: The economy audit check item_custody_missing found violations; the GameService log names them with example ids.
      - eval_time: 30m
        alertname: EconomyAuditFailed
        exp_alerts: []
      - eval_time: 45m
        alertname: EconomyAuditFailed
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The economy audit could not run every check in the last two hours; the GameService log says why.

  - name: A retention task that keeps failing alerts, a lone failure and a task that recovers do not
    interval: 1m
    input_series:
      # One failure a minute for 12 minutes, then none.
      - series: 'game_service_retention_failures_total{job="mmorpg/game-service", instance="g1", task="item_operations", reason="lock_timeout"}'
        values: '0+1x12 12x28'
      # A single failure, which is routine.
      - series: 'game_service_retention_failures_total{job="mmorpg/game-service", instance="g1", task="account_sessions", reason="error"}'
        values: '0 0 1 1x38'
    alert_rule_test:
      - eval_time: 3m
        alertname: RetentionTaskFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: RetentionTaskFailing
        exp_alerts: []
      - eval_time: 15m
        alertname: RetentionTaskFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              task: item_operations
            exp_annotations:
              summary: Retention task item_operations failed at least five times in the last ten minutes, so its table keeps growing; the GameService log says why.
      - eval_time: 35m
        alertname: RetentionTaskFailing
        exp_alerts: []

  - name: A retention task that falls behind alerts, a steady task and one that lost its lag series do not
    interval: 1m
    input_series:
      - series: 'game_service_retention_lag_seconds{job="mmorpg/game-service", instance="g1", task="item_operations"}'
        values: '0 0 0 1200x37'
      - series: 'game_service_retention_lag_seconds{job="mmorpg/game-service", instance="g1", task="account_sessions"}'
        values: '60x40'
      # High for two minutes, then no series, as a task whose pass failed.
      - series: 'game_service_retention_lag_seconds{job="mmorpg/game-service", instance="g1", task="join_tickets"}'
        values: '2000 2000 _x38'
    alert_rule_test:
      - eval_time: 12m
        alertname: RetentionLagHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: RetentionLagHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              task: item_operations
            exp_annotations:
              summary: The oldest due row of retention task item_operations had waited more than 15 minutes when its latest pass began, so the task falls behind its table.

  - name: Checkpoints that keep failing alert, a worker whose checkpoints are saved stays quiet
    interval: 15s
    input_series:
      - series: 'simulation_worker_presence_checkpoint_states_total{instance="w1", outcome="failed"}'
        values: '0+4x40'
      - series: 'simulation_worker_presence_checkpoint_states_total{instance="w1", outcome="saved"}'
        values: '0+10x40'
      - series: 'simulation_worker_presence_checkpoint_states_total{instance="w2", outcome="failed"}'
        values: '0x40'
      - series: 'simulation_worker_presence_checkpoint_states_total{instance="w2", outcome="saved"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 2m
        alertname: CharacterCheckpointsFailing
        exp_alerts: []
      - eval_time: 6m
        alertname: CharacterCheckpointsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: w1
            exp_annotations:
              summary: GameService keeps refusing or failing the place and vitals that w1 sends, so a crash now loses more than the checkpoint interval of play.

  - name: Sessions past their lease on a live worker alert after five minutes
    interval: 15s
    input_series:
      - series: 'game_service_placement_sessions_expired_unreleased{job="mmorpg/game-service", instance="g1"}'
        values: '0x12 2x28'
    alert_rule_test:
      - eval_time: 3m
        alertname: SessionsUnreleasedPastLease
        exp_alerts: []
      - eval_time: 6m
        alertname: SessionsUnreleasedPastLease
        exp_alerts: []
      - eval_time: 9m
        alertname: SessionsUnreleasedPastLease
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Sessions of a worker that still answers are past their lease and unreleased, so it neither renews nor releases every session it holds; the worker log names them.

  - name: A worker that lost GameService alerts after a minute, one that answers does not
    interval: 15s
    input_series:
      - series: 'simulation_worker_game_service_available{instance="w1"}'
        values: '1x8 0x32'
      - series: 'simulation_worker_game_service_heartbeat_age_seconds{instance="w1"}'
        values: '0+1x8 8+15x32'
      - series: 'simulation_worker_game_service_available{instance="w2"}'
        values: '1x40'
      - series: 'simulation_worker_game_service_heartbeat_age_seconds{instance="w2"}'
        values: '3x40'
    alert_rule_test:
      - eval_time: 2m30s
        alertname: WorkerLostGameService
        exp_alerts: []
      - eval_time: 6m
        alertname: WorkerLostGameService
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: w1
            exp_annotations:
              summary: The worker w1 has had no answer from GameService for more than a minute, so items, trade, and quests are paused for its players, and it stops by itself once its outage tolerance has passed.

  - name: A worker whose heartbeat is old alerts even before it counts GameService as unavailable
    interval: 15s
    input_series:
      - series: 'simulation_worker_game_service_available{instance="w1"}'
        values: '1x40'
      - series: 'simulation_worker_game_service_heartbeat_age_seconds{instance="w1"}'
        values: '0+1x8 60x32'
    alert_rule_test:
      - eval_time: 2m
        alertname: WorkerLostGameService
        exp_alerts: []
      - eval_time: 6m
        alertname: WorkerLostGameService
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: w1
            exp_annotations:
              summary: The worker w1 has had no answer from GameService for more than a minute, so items, trade, and quests are paused for its players, and it stops by itself once its outage tolerance has passed.

  - name: One abandoned durable operation alerts at once
    interval: 15s
    input_series:
      - series: 'simulation_worker_game_service_abandoned_operations_total{instance="w1", kind="player_death"}'
        values: '0x10 1x30'
      - series: 'simulation_worker_game_service_abandoned_operations_total{instance="w2", kind="mob_corpse"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 2m
        alertname: AbandonedDurableOperations
        exp_alerts: []
      - eval_time: 4m
        alertname: AbandonedDurableOperations
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: w1
              kind: player_death
            exp_annotations:
              summary: The worker w1 gave up a durable operation of the kind player_death that never committed, which is lost progress; its error line names the operation id.

  - name: Refused intents alert only when they are sustained
    interval: 15s
    input_series:
      # A burst of refusals that ends, and a steady stream of one per second.
      - series: 'simulation_worker_game_service_refused_intents_total{instance="w1", kind="item_operation"}'
        values: '0+0x4 5+0x60'
      - series: 'simulation_worker_game_service_refused_intents_total{instance="w2", kind="item_operation"}'
        values: '0+15x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: DurableActionsRefused
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: w2
            exp_annotations:
              summary: The worker w2 keeps refusing durable player actions because GameService does not answer.

  - name: Failed calls to GameService alert by route group and reason
    interval: 15s
    input_series:
      - series: 'simulation_worker_game_service_call_failures_total{instance="w1", route="item", reason="timeout"}'
        values: '0+3x60'
      - series: 'simulation_worker_game_service_call_failures_total{instance="w1", route="checkpoint", reason="timeout"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: WorkerCallsToGameServiceFail
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: w1
              route: item
              reason: timeout
            exp_annotations:
              summary: Calls of the worker w1 to GameService keep failing on the route group item with the reason timeout.

  - name: A worker that withholds its renewal alerts at once
    interval: 15s
    input_series:
      - series: 'simulation_worker_registry_renewals_withheld_total{instance="w1"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 2m
        alertname: WorkerRenewalsWithheld
        exp_alerts: []
      - eval_time: 4m
        alertname: WorkerRenewalsWithheld
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: w1
            exp_annotations:
              summary: The realtime loop of the worker w1 went silent, so it stopped renewing its registration and GameService takes its Shard offline; a worker that stays silent needs a restart.

  - name: Sustained auth_busy counts the password hashing lane and the revocation slots together
    interval: 15s
    input_series:
      - series: 'game_service_accounts_password_hashing_refusals_total{operation="verify"}'
        values: '0x60'
      - series: 'game_service_redis_session_cache_operations_total{result="revocation_refused"}'
        values: '0+15x60'
      - series: 'game_service_redis_session_cache_operations_total{result="hit"}'
        values: '0+1000x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: LoginsRefusedAsBusy
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: GameService keeps answering logins, registrations, or logouts with auth_busy, because its password hashing is full or too many sessions wait for Redis.
