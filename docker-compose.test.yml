name: shooter-mmo-tests

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shooter_mmo_tests
      POSTGRES_USER: shooter_mmo_tests
      POSTGRES_PASSWORD: shooter_mmo_tests_password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shooter_mmo_tests -d shooter_mmo_tests"]
      interval: 2s
      timeout: 3s
      retries: 20
