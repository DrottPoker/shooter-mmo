name: shooter-mmo-tests

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:?Configure TEST_POSTGRES_DB in .env}
      POSTGRES_USER: ${TEST_POSTGRES_USER:?Configure TEST_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Configure TEST_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
